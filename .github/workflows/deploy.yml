name: Build and Update GitOps

on:
  push:
    branches: [main]

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      # Step 1 — check out the app code
      - uses: actions/checkout@v4

      # Step 2 — build and push the image to Docker Hub
      # No kubectl here — the pipeline never touches the cluster
      - name: Build and push image
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -t ${{ secrets.DOCKER_USERNAME }}/gitops-app:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/gitops-app:${{ github.sha }}

      # Step 3 — update the image tag in k8s-gitops-manifests
      # This is the only thing that triggers ArgoCD to deploy
      - name: Update image tag in k8s-gitops-manifests
        run: |
          git clone https://${{ secrets.GITOPS_TOKEN }}@github.com/${{ github.repository_owner }}/k8s-gitops-manifests.git
          cd k8s-gitops-manifests
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/gitops-app:${{ github.sha }}|" k8s/deployment.yaml
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add k8s/deployment.yaml
          git commit -m "Update image to ${{ github.sha }}"
          git push
          # ArgoCD watches k8s-gitops-manifests and detects this change — no kubectl needed
